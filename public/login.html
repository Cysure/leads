<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · WEB BETTER DEAL FLOW</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="styles.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: var(--navy); }
  .login { background: #fff; border-radius: 16px; padding: 32px 30px; width: min(380px, calc(100vw - 32px)); box-shadow: 0 20px 60px #0008; }
  .login img { height: 40px; display: block; margin-bottom: 18px; }
  .login h1 { font-size: 15px; letter-spacing: .18em; margin: 0 0 4px; color: var(--ink); }
  .login p { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .login label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .login button { width: 100%; margin-top: 20px; padding: 11px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
<form class="login" id="f">
  <img src="img/logo-webbetter.png" alt="Web Better">
  <h1>DEAL FLOW</h1>
  <p>Sales team access only.</p>
  <label for="u">Username</label><input id="u" autocomplete="username" required autofocus>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
  <button class="primary" type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("u").value, password: document.getElementById("p").value }) });
    if (r.ok) location.href = "/";
    else err.textContent = (await r.json().catch(() => ({}))).error || "Sign-in failed";
  };
</script>
</body>
</html>
